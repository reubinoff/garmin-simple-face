name: Build watch face

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs everywhere (also on forks / PRs): needs no Garmin account and no secrets.
  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: XML files are well-formed
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          find . -name '*.xml' -not -path './.git/*' -print0 | xargs -0 xmllint --noout
      - name: Shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Host tests (resources/settings consistency, model of the drawing code, AOD burn-in harness)
        run: |
          sudo apt-get install -y -qq python3-numpy python3-pil python3-lxml   # PEP 668: no pip into system python
          python3 -m unittest discover -s tests/host -v
      - name: No signing keys committed
        run: |
          if git ls-files | grep -Ei '\.(der|pem|b64)$|developer_key'; then
            echo "A developer key file is tracked by git!"; exit 1
          fi

  # Needs the Garmin account secrets (device files are login-gated). Skipped with a warning when they are absent
  # (e.g. pull requests from forks). ubuntu-22.04: the SDK 9.3.0 simulator links libwebkit2gtk-4.0, which
  # ubuntu-24.04 no longer ships (checked with ldd on bin/simulator).
  build:
    needs: static-checks
    runs-on: ubuntu-22.04
    env:
      GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      CIQ_AGREEMENT_HASH: ${{ vars.CIQ_AGREEMENT_HASH }}
      CIQ_DEVELOPER_KEY_B64: ${{ secrets.CIQ_DEVELOPER_KEY_B64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Check required secrets / variables
        id: secrets
        run: |
          ok=true
          for v in GARMIN_USERNAME GARMIN_PASSWORD CIQ_AGREEMENT_HASH CIQ_DEVELOPER_KEY_B64; do
            if [ -z "${!v}" ]; then echo "::warning::Missing $v - SDK build and unit tests skipped (README, 'GitHub Actions')"; ok=false; fi
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      # The Connect IQ docs require Java 11 or higher; the SDK was run with Temurin 21 when this project was created.
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install Connect IQ SDK 9.3.0 and the fenix9pro47mm device files
        if: steps.secrets.outputs.ok == 'true'
        run: scripts/install-sdk.sh

      - name: Write developer key (never printed, never uploaded)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$CIQ_DEVELOPER_KEY_B64" | base64 -d > "$RUNNER_TEMP/keys/developer_key.der"
          chmod 600 "$RUNNER_TEMP/keys/developer_key.der"
          echo "CIQ_DEVELOPER_KEY_PATH=$RUNNER_TEMP/keys/developer_key.der" >> "$GITHUB_ENV"

      - name: Build PRG + IQ (strict type check, warnings on)
        if: steps.secrets.outputs.ok == 'true'
        run: scripts/build.sh --out build

      - name: Connect IQ unit tests (monkeyc -t, simulator under xvfb, monkeydo -t)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libwebkit2gtk-4.0-37 libsoup2.4-1 libjpeg8 libusb-1.0-0
          xvfb-run -a scripts/run-unit-tests.sh

      - name: Upload artifacts
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: NoirTime-fenix9pro47mm
          path: |
            build/NoirTime.prg
            build/NoirTime.iq
          if-no-files-found: error
          retention-days: 90
