name: Build store package

# Manual button (Actions -> "Build store package" -> Run workflow). Builds, signs, tests and packages the watch face and
# attaches NoirTime.iq, NoirTime.prg and store images to a GitHub Release. It does NOT upload to the Connect IQ Store:
# Garmin documents no publish API or CLI; the .iq is uploaded by hand in the Developer Dashboard
# (https://developer.garmin.com/connect-iq/submit-an-app/, DECISIONS.md D-31).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Store version, e.g. 1.0.1 (max 20 chars). It is written into manifest.xml automatically.'
        required: true
        type: string
      whats_new:
        description: "What's New / release notes (optional)"
        required: false
        type: string
        default: ''

permissions:
  contents: write   # create the GitHub Release

jobs:
  package:
    runs-on: ubuntu-22.04   # the SDK 9.3.0 simulator needs libwebkit2gtk-4.0 (see build.yml)
    environment: publish
    env:
      GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      CIQ_AGREEMENT_HASH: ${{ secrets.CIQ_AGREEMENT_HASH }}
      CIQ_DEVELOPER_KEY_B64: ${{ secrets.CIQ_DEVELOPER_KEY_B64 }}
      # inputs go through env, never straight into shell code
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_WHATS_NEW: ${{ inputs.whats_new }}
    steps:
      - uses: actions/checkout@v7

      - name: Required secrets are set
        run: |
          missing=0
          for v in GARMIN_USERNAME GARMIN_PASSWORD CIQ_AGREEMENT_HASH CIQ_DEVELOPER_KEY_B64; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing in the 'publish' environment"; missing=1; fi
          done
          exit $missing

      - name: Set the version in manifest.xml from the input
        run: |
          if [ -z "$INPUT_VERSION" ]; then echo "::error::Version input is empty"; exit 1; fi
          if [ "${#INPUT_VERSION}" -gt 20 ]; then
            echo "::error::Version '$INPUT_VERSION' is longer than 20 characters"; exit 1
          fi
          # Write the chosen version into <iq:application version="..."> so the package always matches the input.
          python3 - "$INPUT_VERSION" <<'PY'
          import sys, re
          version = sys.argv[1]
          with open("manifest.xml", encoding="utf-8") as f:
              s = f.read()
          new, n = re.subn(r'(<iq:application\b[^>]*?\bversion=")[^"]*(")', r'\g<1>%s\g<2>' % version, s, count=1)
          if n != 1:
              sys.exit("could not find the version attribute on <iq:application> in manifest.xml")
          with open("manifest.xml", "w", encoding="utf-8") as f:
              f.write(new)
          print("manifest.xml version set to", version)
          PY

      # The Connect IQ docs require Java 11 or higher; the SDK was run with Temurin 21 when this project was created.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install Connect IQ SDK 9.3.0 and the device files of every manifest product
        run: scripts/install-sdk.sh

      - name: Write developer key (never printed, never uploaded)
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$CIQ_DEVELOPER_KEY_B64" | base64 -d > "$RUNNER_TEMP/keys/developer_key.der"
          chmod 600 "$RUNNER_TEMP/keys/developer_key.der"
          echo "CIQ_DEVELOPER_KEY_PATH=$RUNNER_TEMP/keys/developer_key.der" >> "$GITHUB_ENV"

      - name: Build PRG + IQ (strict type check, warnings on)
        run: scripts/build.sh --out build

      - name: Connect IQ unit tests (monkeyc -t, simulator under xvfb, monkeydo -t)
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth dbus dbus-x11 libwebkit2gtk-4.0-37 libsoup2.4-1 libjpeg8 libusb-1.0-0
          # D-35: the script waits for the simulator's TCP port (up to 60 s), retries up to 3 times with a fresh simulator,
          # and runs under a D-Bus session + a 24-bit Xvfb screen.
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" scripts/run-unit-tests.sh || {
            echo "::group::simulator log"; cat build/simulator.log 2>/dev/null || true; echo "::endgroup::"; exit 1; }

      - name: Store images (cover 500x500 sRGB + screenshots under 150 KB; warnings only)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq imagemagick || echo "::warning::ImageMagick install failed - no store images"
          scripts/store-assets.sh store-assets

      - name: Create GitHub Release v${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          if [ -n "$INPUT_WHATS_NEW" ]; then printf '%s\n' "$INPUT_WHATS_NEW" > "$notes"
          else printf 'Noir Time %s for the fenix 9 Pro 47mm. Store package (NoirTime.iq), sideload build (NoirTime.prg) and store images.\n' "$INPUT_VERSION" > "$notes"; fi
          files=(build/NoirTime.iq build/NoirTime.prg)
          if compgen -G "store-assets/*" > /dev/null; then files+=(store-assets/*); fi
          gh release create "v$INPUT_VERSION" "${files[@]}" --title "Noir Time $INPUT_VERSION" --notes-file "$notes" --target "$GITHUB_SHA"

      - name: Summary - upload to the store by hand
        if: always()
        run: |
          {
            echo "## Noir Time $INPUT_VERSION - store package"
            echo
            echo "Upload to the Connect IQ Store is **manual** (Garmin has no publish API or CLI)."
            echo "Garmin Developer Dashboard: https://apps.garmin.com/developer/dashboard"
            echo
            echo "- [ ] Download **NoirTime.iq** from the release [v$INPUT_VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$INPUT_VERSION)"
            echo "- [ ] Dashboard: **Submit an App** (first version) or open Noir Time and upload a new version"
            echo "- [ ] Type exactly the same version: \`$INPUT_VERSION\`"
            echo "- [ ] Attach \`cover.png\` and the \`screenshot_*\` images from the release"
            echo "- [ ] Paste the What's New text and **submit for review**"
            echo
            echo "Every update must be signed with the same developer key (secret CIQ_DEVELOPER_KEY_B64) - keep a backup of it."
          } >> "$GITHUB_STEP_SUMMARY"
